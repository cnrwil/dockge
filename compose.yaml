services:
  dockge:
    container_name: dockge
    image: ghcr.io/cnrwil/dockge:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Use a named volume so data persists across upgrades and matches
      # the default path used by the original louislam/dockge install.
      # If you were previously using louislam/dockge this volume already
      # exists and your database/settings will be preserved automatically.
      - dockge_data:/app/data

      # If you want to use private registries, you need to share the auth file with Dockge:
      # - /root/.docker/:/root/.docker

      # Stacks Directory
      # ⚠️ READ IT CAREFULLY. If you did it wrong, your data could end up writing into a WRONG PATH.
      # ⚠️ 1. FULL path only. No relative path (MUST)
      # ⚠️ 2. Left Stacks Path === Right Stacks Path (MUST)
      - /opt/stacks:/opt/stacks
    environment:
      # Tell Dockge where is your stacks directory
      - DOCKGE_STACKS_DIR=/opt/stacks
    networks:
      - reverseproxy-nw

volumes:
  dockge_data:

networks:
  reverseproxy-nw:
    external: true
